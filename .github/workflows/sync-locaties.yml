name: Sync locaties vanuit Google Sheets

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Locaties ophalen en geocoderen
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: python3 sync_locaties.py

      - name: Committen
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add locaties.json
          if git diff --cached --quiet; then
            echo "Geen wijzigingen"
          else
            git commit -m "Locaties bijgewerkt vanuit Google Sheets"
            git push
          fi
