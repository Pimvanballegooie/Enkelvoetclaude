name: Sync locaties vanuit Google Sheets

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locaties ophalen en geocoderen
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: |
          python3 - <<'PYEOF'
import json, urllib.request, urllib.parse, os, time, csv, io

SHEET_ID = os.environ.get('SHEET_ID', '')
url = f"https://docs.google.com/spreadsheets/d/{SHEET_ID}/export?format=csv&gid=0"

try:
    req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
    with urllib.request.urlopen(req, timeout=30) as resp:
        csv_data = resp.read().decode('utf-8')
except Exception as e:
    print(f"Fout bij ophalen sheet: {e}")
    exit(1)

reader = csv.DictReader(io.StringIO(csv_data))
rijen = list(reader)
print(f"{len(rijen)} rijen gevonden")

def geocodeer(adres):
    try:
        query = urllib.parse.quote(adres + ', Nederland')
        url = f"https://nominatim.openstreetmap.org/search?q={query}&format=json&limit=1"
        req = urllib.request.Request(url, headers={'User-Agent': 'EVN-Website/1.0'})
        with urllib.request.urlopen(req, timeout=10) as resp:
            resultaten = json.loads(resp.read())
        if resultaten:
            return float(resultaten[0]['lat']), float(resultaten[0]['lon'])
    except Exception as e:
        print(f"Geocoding mislukt voor '{adres}': {e}")
    return None, None

locaties = []
geocode_cache = {}

for rij in rijen:
    status = rij.get('Status', '').strip()
    if status != 'Goedgekeurd':
        continue

    tier     = rij.get('Tier', 'basis').lower().strip()
    praktijk = rij.get('Praktijknaam', '').strip()
    adres    = rij.get('Adres', '').strip()
    website  = rij.get('Website', '').strip()
    telefoon = rij.get('Telefoon locatie', '').strip()
    email    = rij.get('E-mail locatie', '').strip()
    disc_str = rij.get('Disciplines', '').strip()
    beschr   = rij.get('Beschrijving', '').strip()
    logo_url = rij.get('Logo URL', '').strip()

    if not praktijk or not adres:
        continue

    disciplines = [d.strip() for d in disc_str.split(',') if d.strip()]

    if adres not in geocode_cache:
        lat, lng = geocodeer(adres)
        geocode_cache[adres] = (lat, lng)
        time.sleep(1)
    else:
        lat, lng = geocode_cache[adres]

    if not lat or not lng:
        print(f"Geen coordinaten voor: {adres} - overgeslagen")
        continue

    locaties.append({
        'naam': praktijk,
        'adres': adres,
        'website': website,
        'telefoon': telefoon,
        'email': email,
        'disciplines': disciplines,
        'tier': tier,
        'beschrijving': beschr if tier in ['plus', 'partner'] else '',
        'logo_url': logo_url if tier == 'partner' else '',
        'lat': lat,
        'lng': lng
    })
    print(f"OK: {praktijk} ({tier})")

tier_volgorde = {'partner': 0, 'plus': 1, 'basis': 2}
locaties.sort(key=lambda l: tier_volgorde.get(l['tier'], 3))

with open('locaties.json', 'w', encoding='utf-8') as f:
    json.dump(locaties, f, ensure_ascii=False, indent=2)

print(f"Klaar! {len(locaties)} locaties opgeslagen")
PYEOF

      - name: Wijzigingen committen
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add locaties.json
          if git diff --cached --quiet; then
            echo "Geen wijzigingen."
          else
            git commit -m "Locaties bijgewerkt vanuit Google Sheets"
            git push
          fi
